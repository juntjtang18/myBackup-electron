<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBackup</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --line: #dde3ea;
      --ink: #141c24;
      --muted: #647084;
      --accent: #0f766e;
      --accent-hover: #0d655e;
      --accent-soft: #e6f4f1;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --danger-soft: #fef2f2;
      --hero-from: #0f766e;
      --hero-to: #134e4a;
      --log-h: 132px;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(20, 28, 36, 0.06), 0 8px 24px rgba(20, 28, 36, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-frame {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px calc(var(--log-h) + 28px);
    }

    /* Hero */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding: 18px 22px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-to) 100%);
      box-shadow: var(--shadow);
      color: #ffffff;
    }

    .hero-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .hero-title {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .hero-version {
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.75;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-tools label {
      font-size: 0.72rem;
      opacity: 0.8;
      margin: 0;
    }

    .hero-tools .form-select {
      min-width: 96px;
      font-size: 0.78rem;
      padding: 4px 28px 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 6px;
    }

    .hero-tools .form-select:focus {
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
    }

    .hero-tools .form-select option {
      color: var(--ink);
    }

    /* Targets section */
    .targets-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .targets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .targets-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .targets-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .target-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .target-panel.unavailable {
      opacity: 0.58;
      filter: grayscale(0.18);
    }

    .target-panel.is-active {
      border-color: #99f6e4;
      box-shadow: 0 0 0 1px rgba(15, 118, 110, 0.12), var(--shadow);
    }

    .target-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      background: #e8f2f1;
      border-bottom: 1px solid transparent;
    }

    .target-panel.is-active .target-panel-header {
      background: #dceeea;
    }

    .target-panel:not(.collapsed) .target-panel-header {
      border-bottom-color: var(--line);
    }

    .target-panel-header:hover {
      background: #dfece8;
    }

    .target-panel.is-active .target-panel-header:hover {
      background: #d3e8e4;
    }

    .target-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .target-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .target-chevron {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: transform 0.15s ease;
      font-size: 0.72rem;
    }

    .target-panel:not(.collapsed) .target-chevron {
      transform: rotate(90deg);
    }

    .target-panel-title {
      flex: 1;
      min-width: 0;
    }

    .target-panel-label {
      font-size: 0.82rem;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-panel-label-name {
      font-weight: 650;
    }

    .target-panel-label-sep,
    .target-panel-label-path {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      font-weight: 400;
    }

    .target-panel-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .target-panel-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #bfe0d8;
    }

    .target-running-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .target-count-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
    }

    .target-status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f3f4f6;
      color: #4b5563;
    }

    .target-status-unavailable {
      background: #fce7e7;
      border-color: #f5b5b5;
      color: #9f1239;
    }

    .btn-target-action:hover {
      background: #f4f7fa;
    }

    .btn-target-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-target-action.danger {
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-target-action.danger:hover {
      background: var(--danger-soft);
    }

    .target-panel-body {
      padding: 0 14px 14px;
    }

    .target-panel.collapsed .target-panel-body {
      display: none;
    }

    .sources-wrap {
      overflow: auto;
      padding-top: 8px;
    }

    .btn-add {
      flex-shrink: 0;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .btn-add:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .sources-wrap {
      flex: 1;
      overflow: auto;
      padding: 0 18px 16px;
    }

    /* Source table */
    .source-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .source-table th,
    .source-table td {
      padding: 11px 10px;
      vertical-align: top;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    .source-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .source-table tbody tr:last-child td {
      border-bottom: none;
    }

    .source-progress-row td {
      background: #f8fafb;
      padding: 0 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .source-table th:last-child,
    .source-table td:last-child {
      text-align: right;
    }

    .path-cell {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .scan-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: lowercase;
      border: 1px solid var(--line);
      background: #f4f6f8;
      color: var(--muted);
    }

    .scan-badge-running { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .scan-badge-paused { background: var(--warn-soft); border-color: #fed7aa; color: var(--warn); }
    .scan-badge-completed { background: var(--accent-soft); border-color: #99f6e4; color: #0f766e; }
    .scan-badge-idle { background: #f4f6f8; border-color: var(--line); color: var(--muted); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.68rem;
      border: 1px solid var(--line);
      background: #f8fafc;
      margin-right: 4px;
      margin-top: 4px;
    }

    .tag-merge { background: var(--accent-soft); border-color: #bfe0d8; color: #0b5a50; }
    .tag-media { background: var(--warn-soft); border-color: #f1d1aa; color: var(--warn); }

    .actions-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .actions-row .btn {
      font-size: 0.74rem;
      padding: 4px 10px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 0.78rem; }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .source-progress-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      min-width: 0;
      background: #ffffff;
    }

    .progress-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .progress-summary strong { color: var(--ink); }

    .progress-pools {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }

    .progress-pool {
      display: grid;
      gap: 6px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fbfcfd;
    }

    .progress-pool-hash {
      border-left: 4px solid #2563eb;
    }

    .progress-pool-copy {
      border-left: 4px solid #16a34a;
    }

    .pool-heading {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .worker-list { display: grid; gap: 5px; }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
    }

    .queue-title { font-size: 0.72rem; font-weight: 600; }
    .queue-counts { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .queue-list { display: grid; gap: 3px; max-height: 100px; overflow: auto; }
    .queue-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px;
      gap: 6px;
      font-size: 0.72rem;
      line-height: 1.2;
    }
    .queue-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }
    .queue-bytes {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .queue-empty, .queue-more { font-size: 0.72rem; color: var(--muted); }
    .queue-section { display: grid; gap: 3px; }
    .queue-section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .queue-more { font-style: italic; }

    .worker-line {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 96px 128px;
      align-items: center;
      gap: 6px;
      min-width: 0;
      min-height: 20px;
      font-size: 0.74rem;
      line-height: 1.2;
    }

    .worker-line-idle { opacity: 0.5; }
    .worker-line-idle .worker-progress-fill { width: 0 !important; }

    .worker-type {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .worker-type-hash {
      color: #1d4ed8;
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .worker-type-copy {
      color: #15803d;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .worker-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .worker-progress {
      height: 5px;
      background: #e9eef3;
      border-radius: 999px;
      overflow: hidden;
    }

    .worker-progress-fill {
      height: 100%;
      background: var(--accent);
    }

    .worker-line-hash .worker-progress-fill {
      background: #2563eb;
    }

    .worker-line-copy .worker-progress-fill {
      background: #16a34a;
    }

    .worker-bytes {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    /* Log dock */
    .log-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--log-h);
      background: #1a222c;
      border-top: 1px solid #2a3544;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .log-dock-inner {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 24px;
    }

    .log-dock-header {
      flex-shrink: 0;
      padding: 6px 0 4px;
      font-size: 0.62rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7a8799;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .log-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: none;
      letter-spacing: 0;
    }

    .log-copy-status {
      color: #93c5fd;
      font-size: 0.64rem;
      min-width: 42px;
      text-align: right;
    }

    .log-copy-button {
      border: 1px solid #334155;
      border-radius: 6px;
      background: #243142;
      color: #c5cdd8;
      font-size: 0.66rem;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
    }

    .log-copy-button:hover {
      background: #2f4056;
      color: #ffffff;
    }

    .log-list {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem;
      line-height: 1.45;
      user-select: text;
      cursor: text;
    }

    .log-line {
      display: grid;
      grid-template-columns: 68px 44px minmax(0, 1fr);
      gap: 10px;
      padding: 1px 0;
      color: #c5cdd8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      user-select: text;
    }

    .log-time { color: #6b7789; }
    .log-level { font-weight: 600; }
    .log-level-info { color: #6ee7b7; }
    .log-level-warn { color: #fcd34d; }
    .log-level-error { color: #fca5a5; }
    .log-level-debug { color: #93c5fd; }
    .log-msg { overflow: visible; text-overflow: clip; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .log-msg .muted { color: #7a8799; }

    .log-empty {
      padding: 8px 0;
      color: #6b7789;
      font-style: italic;
    }

    /* Add source modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 36, 0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 440px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(20, 28, 36, 0.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
    }

    .modal-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
    }

    .modal-close {
      border: none;
      background: none;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
    }

    .modal-close:hover { color: var(--ink); }

    .modal-body { padding: 16px 18px; }

    .form-grid { display: grid; gap: 12px; }

    .checkbox-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .app-frame { padding-left: 16px; padding-right: 16px; }
      .log-dock-inner { padding: 0 16px; }
      .progress-pools { grid-template-columns: 1fr; }
      .source-table th:nth-child(4),
      .source-table td:nth-child(4) { display: none; }
      .worker-line { grid-template-columns: 38px minmax(0, 1fr) 120px; }
      .worker-bytes { grid-column: 3; }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <header class="hero">
      <div class="hero-brand">
        <h1 class="hero-title">MyBackup</h1>
        <span class="hero-version">v1.0.0</span>
      </div>
      <div class="hero-tools">
        <label for="logLevelSelect">Logs</label>
        <select class="form-select form-select-sm" id="logLevelSelect">
          <option value="debug">debug</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
          <option value="off">off</option>
        </select>
      </div>
    </header>

    <section class="targets-section">
      <div class="targets-header">
        <h2>Backup Targets</h2>
        <button type="button" class="btn-add" id="addTargetButton">+ Add Target</button>
      </div>
      <div class="targets-list" id="targetsContainer"></div>
    </section>
  </div>

  <section class="log-dock" aria-label="Activity log">
    <div class="log-dock-inner">
      <div class="log-dock-header">
        <span>Activity</span>
        <div class="log-actions">
          <span class="log-copy-status" id="logCopyStatus" aria-live="polite"></span>
          <button type="button" class="log-copy-button" id="copyLogsButton">Copy</button>
        </div>
      </div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </section>

  <div class="modal-overlay" id="addSourceModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="addSourceModalLabel">
      <div class="modal-header">
        <h5 class="modal-title" id="addSourceModalLabel">Add Source</h5>
        <button type="button" class="modal-close" id="closeAddSourceButton" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="small muted mb-2" id="addSourceTargetLabel"></div>
        <form class="form-grid" id="sourceForm">
          <div>
            <label class="form-label" for="sourcePathInput">Source folder</label>
            <div class="input-group">
              <input class="form-control form-control-sm" id="sourcePathInput" type="text" placeholder="/Users/you/Documents">
              <button class="btn btn-outline-secondary btn-sm" type="button" id="browseSourceButton">Browse</button>
            </div>
          </div>
          <div class="checkbox-row">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="mergeEnabledInput">
              <label class="form-check-label" for="mergeEnabledInput">Merge</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="organizeMediaInput">
              <label class="form-check-label" for="organizeMediaInput">Organize media</label>
            </div>
          </div>
          <div>
            <label class="form-label" for="mergeKeyInput">Merge key</label>
            <input class="form-control form-control-sm" id="mergeKeyInput" type="text" placeholder="documents">
          </div>
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="cancelAddSourceButton">Cancel</button>
            <button class="btn btn-sm btn-success" type="submit" id="addSourceButton">Register</button>
          </div>
        </form>
      </div>
    </div>
  </div>
