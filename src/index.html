<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBackup</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --line: #dde3ea;
      --ink: #141c24;
      --muted: #647084;
      --accent: #0f766e;
      --accent-hover: #0d655e;
      --accent-soft: #e6f4f1;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --danger-soft: #fef2f2;
      --hero-from: #0f766e;
      --hero-to: #134e4a;
      --log-h: 118px;
      --log-collapsed-h: 40px;
      --log-visible-h: var(--log-h);
      --log-dock-side-pad: 18px;
      --log-dock-control-inset: 12px;
      --log-toggle-size: 26px;
      --log-toggle-gap: 8px;
      --titlebar-h: 56px;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(20, 28, 36, 0.06), 0 8px 24px rgba(20, 28, 36, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-frame {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-height: 0;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 24px calc(var(--log-visible-h) + 28px);
      box-sizing: border-box;
      overflow: hidden;
      transition: padding-bottom 0.18s ease;
    }

    /* Title bar / Hero */
    .titlebar {
      position: relative;
      flex-shrink: 0;
      height: var(--titlebar-h);
      margin: 0;
      padding: 0 16px;
      border-radius: 0;
      background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-to) 100%);
      box-shadow: var(--shadow);
      color: #ffffff;
      -webkit-app-region: drag;
      user-select: none;
    }

    .titlebar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .hero-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .hero-title {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .hero-version {
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.75;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-tools {
      display: none;
    }

    .hero-tools label,
    .hero-tools .form-select {
      display: none;
    }

    .titlebar-right {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      -webkit-app-region: no-drag;
    }

    @keyframes daemon-ping {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .daemon-status-pill.daemon-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 11px 4px 8px;
      border-radius: 999px;
      cursor: default;
      border: 1px solid transparent;
      transition: background 0.18s, border-color 0.18s;
      user-select: none;
      color: #e2e8f0;
      font-size: 0.72rem;
      line-height: 1;
      white-space: nowrap;
    }

    .daemon-status-pill.daemon-badge:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .daemon-badge__dot-wrap {
      position: relative;
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }

    .daemon-badge__dot,
    .daemon-badge__ring {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: absolute;
      inset: 0;
    }

    .daemon-badge__label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #e2e8f0;
    }

    .daemon-badge__state {
      font-size: 0.68rem;
      opacity: 0.75;
      color: #e2e8f0;
    }

    .daemon-badge__caret {
      opacity: 0.5;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .daemon-status-pill.running .daemon-badge__dot {
      background: #22c55e;
    }

    .daemon-status-pill.running .daemon-badge__ring {
      background: #4ade80;
      opacity: 0.45;
      animation: daemon-ping 1.8s ease-in-out infinite;
    }

    .daemon-status-pill.running .daemon-badge__state {
      color: #22c55e;
      opacity: 1;
    }

    .daemon-status-pill.stopped .daemon-badge__dot {
      background: #ef4444;
    }

    .daemon-status-pill.stopped .daemon-badge__ring {
      background: #f87171;
      opacity: 0.42;
      animation: none;
    }

    .daemon-status-pill.stopped .daemon-badge__state {
      color: #fca5a5;
      opacity: 1;
    }

    .daemon-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      background: #1e2530;
      border: 1px solid #2e3845;
      border-radius: 10px;
      padding: 12px;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      color: #cbd5e1;
      display: none;
    }

    .daemon-dropdown.open {
      display: block;
      animation: daemon-dropdown-in 0.18s ease forwards;
    }

    @keyframes daemon-dropdown-in {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .daemon-dropdown__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .daemon-dropdown__item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.68rem;
      line-height: 1.3;
      color: #94a3b8;
    }

    .daemon-dropdown__item b {
      color: #e2e8f0;
      font-weight: 600;
    }

    .daemon-dropdown__item-value {
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
      text-align: right;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .daemon-dropdown__item-value.path {
      max-width: 140px;
    }

    .titlebar .hero-tools label,
    .titlebar .hero-tools .form-select,
    .titlebar .window-controls,
    .titlebar .window-control {
      -webkit-app-region: no-drag;
    }

    .window-controls {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      height: var(--titlebar-h);
      padding-left: 12px;
    }

    body.platform-darwin .titlebar-inner {
      padding-left: 84px;
    }

    body:not(.platform-darwin) .titlebar-inner {
      padding-left: 156px;
    }

    body.platform-darwin .window-controls-win {
      display: none;
    }

    body:not(.platform-darwin) .window-controls-mac {
      display: none;
    }

    .window-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      padding: 0;
      cursor: pointer;
      background: transparent;
      color: inherit;
      -webkit-app-region: no-drag;
    }

    .window-controls-mac .window-control {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.12);
      opacity: 0.92;
      transition: opacity 0.12s ease;
    }

    .window-controls-mac .window-control:hover {
      opacity: 1;
    }

    .window-controls-mac .window-control-close {
      background: #ff5f57;
    }

    .window-controls-mac .window-control-minimize {
      background: #febc2e;
    }

    .window-controls-mac .window-control-maximize {
      background: #28c840;
    }

    .window-controls-win {
      gap: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .window-controls-win .window-control {
      width: 44px;
      height: 28px;
      font-size: 0.95rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.12s ease;
    }

    .window-controls-win .window-control:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .window-controls-win .window-control-close:hover {
      background: #e81123;
      color: #ffffff;
    }

    .window-icon-restore {
      display: none;
    }

    body.window-maximized .window-icon-maximize {
      display: none;
    }

    body.window-maximized .window-icon-restore {
      display: inline;
    }

    /* Targets section */
    .targets-section {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .targets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .targets-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .targets-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .target-panel {
      flex-shrink: 0;
      width: 100%;
      min-width: 720px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .target-panel.unavailable {
      opacity: 0.58;
      filter: grayscale(0.18);
    }

    .target-panel.is-active {
      border-color: #99f6e4;
      box-shadow: 0 0 0 1px rgba(15, 118, 110, 0.12), var(--shadow);
    }

    .target-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      background: #e8f2f1;
      border-bottom: 1px solid transparent;
    }

    .target-panel.is-active .target-panel-header {
      background: #dceeea;
    }

    .target-panel:not(.collapsed) .target-panel-header {
      border-bottom-color: var(--line);
    }

    .target-panel-header:hover {
      background: #dfece8;
    }

    .target-panel.is-active .target-panel-header:hover {
      background: #d3e8e4;
    }

    .target-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .target-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .target-chevron {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: transform 0.15s ease;
      font-size: 0.72rem;
    }

    .target-panel:not(.collapsed) .target-chevron {
      transform: rotate(90deg);
    }

    .target-panel-title {
      flex: 1;
      min-width: 0;
    }

    .target-panel-label {
      font-size: 0.82rem;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-panel-label-name {
      font-weight: 650;
    }

    .target-panel-label-sep,
    .target-panel-label-path {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      font-weight: 400;
    }

    .target-panel-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .target-panel-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .target-actions-row {
      position: relative;
      min-height: 48px;
      min-width: 154px;
      overflow: hidden;
    }

    .target-actions-group {
      position: absolute;
      top: 0;
      right: 74px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 48px;
      will-change: transform, opacity;
    }

    .target-actions-row.is-normal-mode .target-actions-group--normal {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .target-actions-row.is-normal-mode .target-actions-group--settings {
      opacity: 0;
      transform: translateX(-16px);
      pointer-events: none;
    }

    .target-actions-row.is-settings-mode .target-actions-group--normal {
      opacity: 0;
      transform: translateX(-16px);
      pointer-events: none;
    }

    .target-actions-row.is-settings-mode .target-actions-group--settings {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .target-actions-row.is-to-settings .target-actions-group--normal {
      animation: action-hide-left 0.22s ease forwards;
    }

    .target-actions-row.is-to-settings .target-actions-group--settings {
      animation: action-show-from-right 0.22s ease forwards;
    }

    .target-actions-row.is-to-normal .target-actions-group--settings {
      animation: action-hide-left 0.22s ease forwards;
    }

    .target-actions-row.is-to-normal .target-actions-group--normal {
      animation: action-show-from-right 0.22s ease forwards;
    }

    .target-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      height: 30px;
      padding: 0 10px;
      box-sizing: border-box;
      font-size: 0.68rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #bfe0d8;
      white-space: nowrap;
    }

    .target-running-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .target-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      height: 30px;
      padding: 0 10px;
      box-sizing: border-box;
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f3f4f6;
      color: #4b5563;
      white-space: nowrap;
    }

    .target-status-unavailable {
      background: #fce7e7;
      border-color: #f5b5b5;
      color: #9f1239;
    }

    .btn-target-action {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 48px;
      min-height: 48px;
      padding: 5px 8px 6px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #243041;
      font-size: 0.6rem;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: 0;
      cursor: pointer;
      white-space: normal;
      text-align: center;
      box-shadow: none;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-target-action .btn-label,
    .btn-action .btn-label {
      display: block;
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1;
    }

    .btn-target-action .btn-icon,
    .btn-action .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .btn-target-action .btn-icon svg,
    .btn-action .btn-icon svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .btn-target-action.add-source-button {
      width: 80px;
      min-width: 80px;
      background: transparent;
      border-color: transparent;
      color: #214233;
      box-shadow: none;
      gap: 3px;
    }

    .btn-target-action.remove-target-button {
      width: 68px;
      min-width: 68px;
      gap: 3px;
    }

    .btn-target-action.settings {
      width: 68px;
      min-width: 68px;
      gap: 3px;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .btn-target-action.settings.active {
      background: #dfe9e7;
      border-color: #b9cbc6;
      color: #1f5b54;
    }

    .btn-target-action.settings:hover {
      background: #ffffff;
      border-color: #1d1d1f;
      color: #1d1d1f;
    }

    .btn-target-action:hover {
      background: #ffffff;
      border-color: #1d1d1f;
      color: #1d1d1f;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.78) inset;
    }

    .btn-target-action.add-source-button:hover {
      background: #ffffff;
      border-color: #1d1d1f;
      color: #1d1d1f;
    }

    .btn-target-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-target-action.danger {
      color: #b91c1c;
      border-color: transparent;
      background: transparent;
    }

    .btn-target-action.danger:hover {
      background: #ffffff;
      border-color: #1d1d1f;
      color: #b91c1c;
    }

    .target-panel-body {
      padding: 0 14px 14px;
    }

    .target-panel.collapsed .target-panel-body {
      display: none;
    }

    .sources-wrap {
      padding-top: 8px;
    }

    .btn-add {
      flex-shrink: 0;
      min-height: 30px;
      padding: 0 14px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 8px;
      background: #214233;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .btn-add:hover {
      background: #183629;
    }

    .btn-add:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .source-card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-card-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-card {
      border: 1px solid #dbe4f0;
      border-radius: 14px;
      background: #ffffff;
      padding: 14px 22px 14px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .source-card.is-copying {
      border-color: #c9d7f3;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85) inset, 0 0 0 1px rgba(99, 102, 241, 0.08);
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
    }

    .source-card:hover {
      border-color: #000000;
    }

    .source-card-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 168px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .source-card-side {
      min-width: 0;
    }

    .source-card-path-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .source-card-source {
      display: flex;
      justify-content: flex-end;
    }

    .source-card-source .source-card-path-row {
      width: 100%;
      justify-content: flex-end;
    }

    .source-card-source .source-card-path {
      flex: 1 1 0;
      text-align: right;
    }

    .source-card-source .source-card-side-icon {
      flex-shrink: 0;
    }

    .source-card-side-icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
    }

    .source-card-side-icon svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    .source-card-target-icon {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .source-card-source-icon {
      color: #4f6b9a;
      background: #eef3fa;
    }

    .source-card-path {
      min-width: 0;
      font-size: 0.82rem;
      line-height: 1.25;
      color: #1f2937;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-card-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #a6b2c3;
      padding-top: 2px;
    }

    .source-card-transfer {
      position: relative;
      width: 216px;
      height: 56px;
      display: flex;

      top: 50%;

      0% {
        border-color: #6d63ff;
        box-shadow: 0 0 0 3px rgba(109, 99, 255, 0.1), 0 0 0 0 rgba(109, 99, 255, 0.24);
        filter: none;
      }
      100% {
        border-color: #a5b4fc;
        box-shadow: 0 0 0 6px rgba(109, 99, 255, 0.18), 0 0 18px rgba(109, 99, 255, 0.34);
        filter: saturate(1.18);
      }
    }

    .source-card-arrow-shaft {
      position: absolute;
      left: 32px;
      right: 10px;
      top: 10px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(203, 213, 225, 0.1) 0%, #cbd5e1 18%, #d8e0ea 100%);
    }

    .source-card-arrow-head {
      position: absolute;
      left: 14px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      color: #aab6c7;
    }

    .source-card-arrow-dot {
      position: absolute;
      top: 7px;
      right: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0;
      transform: translateX(0);
      background: #7c90cf;
      box-shadow: 0 0 0 3px rgba(124, 144, 207, 0.16);

      animation: source-card-arrow-head-pulse 1.75s ease-out infinite;
      animation-delay: var(--arrow-phase);
    }

    .source-card-arrow.is-copying .source-card-arrow-dot {
      animation: source-card-arrow-flow 1.75s linear infinite;
      animation-delay: calc(var(--arrow-phase) + var(--arrow-dot-delay, 0s));
    }

    .source-card-arrow.is-copying .source-card-arrow-dot-2 {
      --arrow-dot-delay: 0.24s;
    }

    .source-card-arrow.is-copying .source-card-arrow-dot-3 {
      --arrow-dot-delay: 0.48s;
    }

    @keyframes source-card-arrow-flow {
      0% {
        opacity: 0;
        transform: translateX(0);
      }
      10% {
        opacity: 1;
      }
      92% {
        opacity: 1;
      }
      98% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateX(-172px);
      }
    }

    .worker-type-hash {
      color: #1d4ed8;
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .worker-type-copy {
      color: #15803d;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .worker-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .worker-progress {
      height: 5px;
      background: #e9eef3;
      border-radius: 999px;
      overflow: hidden;
    }

    .worker-progress-fill {
      height: 100%;
      background: var(--accent);
    }

    .worker-line-hash .worker-progress-fill {
      background: #2563eb;
    }

    .worker-line-copy .worker-progress-fill {
      background: #16a34a;
    }

    .worker-bytes {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    body.log-dock-collapsed {
      --log-visible-h: var(--log-collapsed-h);
    }

    /* Log dock */
    .log-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--log-visible-h);
      background: #1f1f1f;
      border-top: 1px solid #373737;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: height 0.18s ease;
      overflow: hidden;
    }

    .log-dock-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .log-dock-header {
      flex-shrink: 0;
      min-height: 36px;
      padding: 8px calc(2 * var(--log-toggle-size) + 64px + var(--log-dock-control-inset)) 8px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #aeb7c6;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #383838;
    }

    .log-header-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .log-level-select {
      min-width: 84px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid #4c5563;
      background: #242a32;
      color: #dbe4ef;
      font-size: 0.66rem;
      font-weight: 600;
      line-height: 1;
      padding: 0 20px 0 8px;
      letter-spacing: 0;
      text-transform: none;
      box-shadow: none;
    }

    .log-level-select:focus {
      outline: none;
      border-color: #687486;
      box-shadow: 0 0 0 1px rgba(143, 182, 255, 0.25);
    }

    .log-level-select option {
      color: #1f2937;
      background: #ffffff;
    }

    .log-dock-controls {
      position: absolute;
      top: 6px;
      right: var(--log-dock-control-inset);
      z-index: 2;
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
    }

    .log-copy-status {
      color: #8fb6ff;
      font-size: 0.68rem;
      min-width: 42px;
      line-height: var(--log-toggle-size);
      text-align: right;
    }

    .log-copy-button,
    .log-toggle-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: var(--log-toggle-size);
      min-width: var(--log-toggle-size);
      height: var(--log-toggle-size);
      border: 1px solid #4c5563;
      border-radius: 6px;
      background: #242a32;
      color: #dbe4ef;
      padding: 0;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .log-toggle-button {
      position: static;
    }

    .log-copy-button svg,
    .log-toggle-button svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .log-copy-button:hover,
    .log-toggle-button:hover {
      background: #2c3440;
      border-color: #687486;
      color: #ffffff;
    }

    .log-toggle-icon-show {
      display: none;
    }

    body.log-dock-collapsed .log-copy-status,
    body.log-dock-collapsed .log-copy-button {
      visibility: hidden;
      pointer-events: none;
    }

    body.log-dock-collapsed .log-toggle-icon-hide {
      display: none;
    }

    body.log-dock-collapsed .log-toggle-icon-show {
      display: block;
    }

    body.log-dock-collapsed .log-list {
      display: none;
    }

    .log-list {
      list-style: none;
      padding: 0 8px 8px;
      margin: 0;
      flex: 1;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.56rem;
      line-height: 1.3;
      font-weight: 400;
      user-select: text;
      cursor: text;
      background: #1f1f1f;
      scrollbar-color: #5a5a5a #1f1f1f;
      scrollbar-width: thin;
    }

    .log-list::-webkit-scrollbar {
      width: 10px;
      height: 10px;
      background: #1f1f1f;
    }

    .log-list::-webkit-scrollbar-track {
      background: #1f1f1f;
    }

    .log-list::-webkit-scrollbar-thumb {
      background: #5a5a5a;
      border-radius: 0;
      border: 0;
    }

    .log-list::-webkit-scrollbar-thumb:hover {
      background: #6b6b6b;
    }

    .log-list::-webkit-scrollbar-corner {
      background: #1f1f1f;
    }

    .log-line {
      display: grid;
      grid-template-columns: 84px 42px minmax(0, 1fr);
      gap: 8px;
      padding: 1px 0;
      color: #c3cad4;
      user-select: text;
    }

    .log-time {
      color: #768194;
      white-space: nowrap;
    }
    .log-level {
      font-weight: 700;
      white-space: nowrap;
    }
    .log-level-info { color: #75a7ff; }
    .log-level-warn { color: #f5c768; }
    .log-level-error { color: #ff9f9f; }
    .log-level-debug { color: #7dd3fc; }
    .log-msg {
      overflow: visible;
      text-overflow: clip;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      color: #cdd4dd;
    }
    .log-msg .muted { color: #8b94a5; }

    .log-empty {
      padding: 8px 0;
      color: #8b94a5;
      font-style: italic;
    }

    /* Add source modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 36, 0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 440px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(20, 28, 36, 0.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
    }

    .modal-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
    }

    .modal-close {
      border: none;
      background: none;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
    }

    .modal-close:hover { color: var(--ink); }

    .modal-body { padding: 16px 18px; }

    .form-grid { display: grid; gap: 12px; }

    .modal .btn,
    .input-group .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.75) inset;
    }

    .modal .btn-outline-secondary,
    .input-group .btn-outline-secondary {
      border-color: #d1d9e4;
      background: #f8fafc;
      color: #374151;
    }

    .modal .btn-outline-secondary:hover,
    .input-group .btn-outline-secondary:hover {
      border-color: #bac6d5;
      background: #eef3f8;
      color: #1f2937;
    }

    .modal .btn-success {
      border-color: #214233;
      background: #214233;
      color: #eef7f3;
      box-shadow: none;
    }

    .modal .btn-success:hover {
      border-color: #183629;
      background: #183629;
      color: #ffffff;
    }

    .checkbox-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .app-frame { padding-left: 16px; padding-right: 16px; }
      .log-dock-inner {
        --log-dock-side-pad: 16px;
        --log-dock-control-inset: 12px;
      }
      .progress-pools { grid-template-columns: 1fr; }
      .source-card {
        padding: 12px 14px 14px;
      }
      .source-card-top {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .source-card-center {
        order: 2;
      }
      .source-card-source {
        justify-content: flex-start;
      }
      .source-card-source .source-card-path-row {
        justify-content: flex-start;
      }
      .source-card-source .source-card-path {
        text-align: left;
      }
      .source-card-bottom {
        flex-direction: column;
        align-items: stretch;
      }
      .daemon-status-pill {
        transform: scale(0.95);
        transform-origin: right center;
      }
      .actions-row { flex-wrap: wrap; }
      .worker-line { grid-template-columns: 38px minmax(0, 1fr) 120px; }
      .worker-bytes { grid-column: 3; }
    }
  </style>
</head>
<body>
  <header class="titlebar" id="appTitlebar">
    <div class="window-controls window-controls-mac" aria-label="Window controls">
      <button type="button" class="window-control window-control-close" data-window-action="close" aria-label="Close"></button>
      <button type="button" class="window-control window-control-minimize" data-window-action="minimize" aria-label="Minimize"></button>
      <button type="button" class="window-control window-control-maximize" data-window-action="maximize" aria-label="Maximize"></button>
    </div>
    <div class="window-controls window-controls-win" aria-label="Window controls">
      <button type="button" class="window-control window-control-minimize" data-window-action="minimize" aria-label="Minimize">&#8722;</button>
      <button type="button" class="window-control window-control-maximize" data-window-action="maximize" aria-label="Maximize">
        <span class="window-icon window-icon-maximize" aria-hidden="true">&#9633;</span>
        <span class="window-icon window-icon-restore" aria-hidden="true">&#10697;</span>
      </button>
      <button type="button" class="window-control window-control-close" data-window-action="close" aria-label="Close">&#10005;</button>
    </div>
    <div class="titlebar-inner">
      <div class="titlebar-left">
        <div class="hero-brand">
          <h1 class="hero-title">MyBackup</h1>
          <span class="hero-version" id="heroVersionLabel">v0.0.0</span>
        </div>
      </div>
      <div class="titlebar-right">
        <div class="daemon-status-pill daemon-badge stopped" id="daemonStatusPill" role="button" aria-live="polite" aria-expanded="false" tabindex="0">
          <span class="daemon-badge__dot-wrap" aria-hidden="true">
            <span class="daemon-badge__ring"></span>
            <span class="daemon-badge__dot"></span>
          </span>
          <span class="daemon-badge__label">Daemon</span>
          <span class="daemon-badge__state" id="daemonStatusValue">Stopped</span>
          <svg class="daemon-badge__caret" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <polyline points="2,3.5 5,6.5 8,3.5" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
        </div>
        <div class="daemon-dropdown" id="daemonStatusPanel" aria-hidden="true">
          <ul class="daemon-dropdown__list">
            <li class="daemon-dropdown__item">
              <b>Watching</b>
              <span class="daemon-dropdown__item-value" id="daemonPanelWatchingCount">0 paths</span>
            </li>
            <li class="daemon-dropdown__item">
              <b>Path</b>
              <span class="daemon-dropdown__item-value path" id="daemonPanelWatchedPath">n/a</span>
            </li>
            <li class="daemon-dropdown__item">
              <b>Event</b>
              <span class="daemon-dropdown__item-value" id="daemonPanelEventCount">0</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="app-frame">
    <section class="targets-section">
      <div class="targets-header">
        <h2>Backup Targets</h2>
        <button type="button" class="btn-add" id="addTargetButton">+ Add Target</button>
      </div>
      <div class="targets-list" id="targetsContainer"></div>
    </section>
  </div>

  <section class="log-dock" aria-label="Activity log">
    <div class="log-dock-inner">
      <div class="log-dock-header">
        <div class="log-header-main">
          <span>Activity</span>
          <select class="log-level-select" id="logLevelSelect" aria-label="Log level">
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
            <option value="off">off</option>
          </select>
        </div>
      </div>
      <div class="log-dock-controls">
        <span class="log-copy-status" id="logCopyStatus" aria-live="polite"></span>
        <button type="button" class="log-copy-button" id="copyLogsButton" aria-label="Copy logs" title="Copy logs">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="5" y="4" width="8" height="10" rx="1.5"></rect>
            <path d="M4 11H3.5A1.5 1.5 0 0 1 2 9.5v-7A1.5 1.5 0 0 1 3.5 1h7A1.5 1.5 0 0 1 12 2.5V3"></path>
          </svg>
        </button>
        <button type="button" class="log-toggle-button" id="toggleLogDockButton" aria-expanded="true" aria-controls="logList" aria-label="Hide activity log" title="Hide activity log">
          <svg class="log-toggle-icon log-toggle-icon-hide" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 6l5 5 5-5"></path>
          </svg>
          <svg class="log-toggle-icon log-toggle-icon-show" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 10l5-5 5 5"></path>
          </svg>
        </button>
      </div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </section>

  <div class="modal-overlay" id="addSourceModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="addSourceModalLabel">
      <div class="modal-header">
        <h5 class="modal-title" id="addSourceModalLabel">Add Source</h5>
        <button type="button" class="modal-close" id="closeAddSourceButton" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="small muted mb-2" id="addSourceTargetLabel"></div>
        <form class="form-grid" id="sourceForm">
          <div>
            <label class="form-label" for="sourcePathInput">Source folder</label>
            <div class="input-group">
              <input class="form-control form-control-sm" id="sourcePathInput" type="text" placeholder="/Users/you/Documents">
              <button class="btn btn-outline-secondary btn-sm" type="button" id="browseSourceButton">Browse</button>
            </div>
          </div>
          <div>
            <label class="form-label" for="targetFolderInput">Target folder</label>
            <div class="input-group">
              <input class="form-control form-control-sm" id="targetFolderInput" type="text" placeholder="<backup target>/source folder">
              <button class="btn btn-outline-secondary btn-sm" type="button" id="browseTargetFolderButton">Browse</button>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="cancelAddSourceButton">Cancel</button>
            <button class="btn btn-sm btn-success" type="submit" id="addSourceButton">Register</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="./progressPanel.js"></script>
  <script src="./excludeEditorPanel.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
